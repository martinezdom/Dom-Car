<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title}">Título</title>
  <link rel="icon" type="image/png" th:href="@{/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <div th:fragment="header">
    <header class="bg-blue-600 text-white shadow-md">
      <div class="max-w-7xl mx-auto p-4 flex flex-col md:flex-row justify-between items-center">
        <a href="/" class="text-2xl font-bold hover:text-blue-100 transition-colors">DomCar</a>
        <h2 class="text-sm mt-2 md:mt-0 text-blue-100">
          Desarrollada por
          <a href="https://github.com/martinezdom" target="_blank" class="text-white hover:underline font-semibold">Miguel Ángel Martínez</a>
        </h2>
      </div>
    </header>
  </div>

  <div th:fragment="messages(infoMensaje, errores)" class="max-w-7xl mx-auto px-4 mt-6">
    <div th:if="${infoMensaje != null}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      <p th:text="${infoMensaje}"></p>
    </div>
    <div th:if="${errores != null}">
      <div th:if="${errores instanceof T(java.util.Map)}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        <ul>
            <li th:each="err : ${errores}" th:text="${err.value}"></li>
        </ul>
      </div>
      <div th:if="${errores instanceof T(java.lang.String)}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        <p th:text="${errores}"></p>
      </div>
    </div>
  </div>

  <div th:fragment="footer">
    <footer class="bg-gray-800 text-white py-6 mt-12">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="font-bold text-lg mb-2">DomCar</p>
        <p class="text-gray-400 text-sm">Miguel Ángel Martínez</p>
      </div>
    </footer>
  </div>
</body>
</html>

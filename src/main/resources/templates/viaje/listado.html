<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="fragments/fragments :: head('Listado de viajes')"></head>

<body class="bg-slate-50 font-sans text-gray-800 min-h-screen flex flex-col">
  <div th:replace="fragments/fragments :: header"></div>
  <main class="grow max-w-7xl mx-auto px-4 py-8 w-full">
    <div th:replace="fragments/fragments :: messages(${infoMensaje}, ${errores})"></div>
    <section th:unless="${sinResultados}" class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <h3 class="text-2xl font-bold text-blue-800">Listado de Viajes</h3>
      
      <form action="/" method="get" class="flex gap-2 w-full md:w-auto">
          <input type="text" id="destino" name="destino" placeholder="Introduce destino..." 
            class="grow md:grow-0 border border-gray-300 rounded px-3 py-2 text-sm" />
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 transition-colors">
            Buscar
          </button>
      </form>
    </section>

    <section th:if="${viajes.size() == 0}" class="bg-white p-6 rounded shadow-md text-center">
      <p th:text="${sinResultados}" class="text-lg text-gray-600 mb-4"></p>
      <div class="flex justify-center gap-4">
        <a href="/" class="text-blue-600 hover:underline">Volver al listado de viajes</a>
        <a href="/viaje/add" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors">Añadir Nuevo Viaje</a>
      </div>
    </section>

    <section th:unless="${viajes.size() == 0}">
      <div class="overflow-x-auto bg-white shadow-md rounded">
        <table class="w-full text-center border-collapse">
          <thead>
            <tr class="bg-blue-100 text-blue-900 border-b border-blue-200">
              <th class="p-3 font-semibold text-sm">Cod. Viaje</th>
              <th class="p-3 font-semibold text-sm">Ruta</th>
              <th class="p-3 font-semibold text-sm">Propietario</th>
              <th class="p-3 font-semibold text-sm">Fecha y hora de salida</th>
              <th class="p-3 font-semibold text-sm">Estado</th>
              <th class="p-3 font-semibold text-sm">Acciones</th>
              <th class="p-3 font-semibold text-sm">Reservas</th>
              <th class="p-3 font-semibold text-sm">Disponibles</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="viaje : ${viajes}" class="border-b border-gray-100 hover:bg-slate-50 transition-colors">
              <td th:text="${viaje.getCodViaje()}" class="p-3 text-sm text-gray-700"></td>
              <td th:text="${viaje.getRuta()}" class="p-3 text-sm text-gray-700 font-medium"></td>
              <td th:text="${viaje.getPropietario()}" class="p-3 text-sm text-gray-700"></td>
              <td th:text="${#temporals.format(viaje.getFechaSalida(), 'dd-MM-yyyy ''a las'' HH:mm')}" class="p-3 text-sm text-gray-700"></td>
              <td class="p-3 text-sm">
                <span th:if="${#strings.toString(viaje.getEstado()) == 'ABIERTO'}" th:text="${viaje.getEstado()}" class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold"></span>
                <span th:if="${#strings.toString(viaje.getEstado()) == 'CERRADO'}" th:text="${viaje.getEstado()}" class="bg-gray-200 text-gray-800 px-2 py-1 rounded text-xs font-semibold"></span>
                <span th:if="${#strings.toString(viaje.getEstado()) == 'CANCELADO'}" th:text="${viaje.getEstado()}" class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-semibold"></span>
              </td>
              <td class="p-3 text-sm flex flex-col gap-1 items-center justify-center">
                <span th:if="${viaje.estaDisponible}">
                  <a th:href="@{/viaje/reserva/add(codViaje=${viaje.getCodViaje()})}" class="text-blue-600 hover:underline">Reservar</a>
                </span>
                <a th:href="@{/viaje(codViaje=${viaje.getCodViaje()})}" class="text-blue-600 hover:underline">Ver detalle</a>
                <span th:if="${viaje.seHanRealizadoReservas}">
                  <a th:href="@{/viaje/reservas(codViaje=${viaje.getCodViaje()})}" class="text-blue-600 hover:underline">Ver reservas</a>
                </span>
                <span th:if="${!viaje.isCerrado()}">
                  <a th:href="@{/viaje/cancel(codViaje=${viaje.getCodViaje()})}" class="text-red-600 hover:underline">Cancelar viaje</a>
                </span>
              </td>
              <td th:text="${viaje.getNumReservas()}" class="p-3 text-sm text-gray-700"></td>
              <td th:text="${viaje.getPlazasDisponibles()}" class="p-3 text-sm text-gray-700 font-bold"></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="mt-6 flex gap-4">
        <a href="/viaje/add" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors">
          Añadir nuevo viaje
        </a>
        <span th:if="${destino != null}">
          <a href="/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition-colors">
            Volver al listado de viajes
          </a>
        </span>
      </div>
    </section>

  </main>
  <footer th:replace="fragments/fragments :: footer"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="fragments/fragments :: head('Añadir Viaje')"></head>

<body class="bg-slate-50 font-sans text-gray-800 min-h-screen flex flex-col">
    <div th:replace="fragments/fragments :: header"></div>
    <main class="grow max-w-2xl mx-auto px-4 py-8 w-full">
        <div th:replace="fragments/fragments :: messages(${infoMensaje}, ${errores})"></div>

        <section class="bg-white shadow-md rounded-lg p-6">
            <h3 class="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">Añadir Nuevo Viaje</h3>
            <form action="/viaje/add" method="post" class="space-y-4">
                <div>
                    <label for="propietario" class="block text-sm font-medium text-gray-700 mb-1">Propietario:</label>
                    <input type="text" id="propietario" name="propietario" required 
                              class="w-full border border-gray-300 rounded-md px-3 py-2" />
                </div>
                <div>
                    <label for="ruta" class="block text-sm font-medium text-gray-700 mb-1">Ruta:</label>
                    <input type="text" id="ruta" name="ruta" placeholder="Origen-Destino" required 
                              class="w-full border border-gray-300 rounded-md px-3 py-2" />
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Salida:</label>
                        <input type="date" id="fecha" name="fecha" required 
                               class="w-full border border-gray-300 rounded-md px-3 py-2" />
                    </div>
                    <div>
                        <label for="hora" class="block text-sm font-medium text-gray-700 mb-1">Hora de Salida:</label>
                        <input type="time" id="hora" name="hora" required 
                               class="w-full border border-gray-300 rounded-md px-3 py-2" />
                    </div>
                </div>
                <div>
                    <label for="duracion" class="block text-sm font-medium text-gray-700 mb-1">Duración (minutos):</label>
                    <input type="number" id="duracion" name="duracion" min="1" required 
                              class="w-full border border-gray-300 rounded-md px-3 py-2" />
                </div>
                <div>
                    <label for="precio" class="block text-sm font-medium text-gray-700 mb-1">Precio (€):</label>
                    <input type="number" id="precio" name="precio" step="0.01" min="0" required 
                              class="w-full border border-gray-300 rounded-md px-3 py-2" />
                </div>
                <div>
                    <label for="plazasOfertadas" class="block text-sm font-medium text-gray-700 mb-1">Plazas Ofertadas:</label>
                    <input type="number" id="plazasOfertadas" name="plazasOfertadas" min="1" max="6" required 
                              class="w-full border border-gray-300 rounded-md px-3 py-2" />
                </div>
                <div class="flex items-center gap-4 pt-4">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors font-bold shadow-sm">
                        Guardar Viaje
                    </button>
                    <a href="/" class="text-gray-600 hover:text-gray-800 hover:underline transition-colors font-medium">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>
    <footer th:replace="fragments/fragments :: footer"></footer>
</body>

</html>
